name: ARC US/UK Content Farm Engine

on:
  schedule:
    # Triggers every 4 hours precisely at 00:00, 04:00, 08:00, 12:00, 16:00, and 20:00 UTC
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arc-reel-publisher
  cancel-in-progress: true

jobs:
  deploy-arc-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Bold Fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run ARC Publishing & Auto-DM Engine
        env:
          META_TOKEN_1: ${{ secrets.META_TOKEN_1 }}
          META_TOKEN_2: ${{ secrets.META_TOKEN_2 }}
          ARC_DIRECT_URL: ${{ secrets.ARC_DIRECT_URL }}
          PYTHONUNBUFFERED: "1"
        run: python -u arc_engine.py

      - name: Lock History, Round-Robin Cursor & Replied Comments Back to Repo
        if: always()
        run: |
          git config user.name "ARC Auto-Ledger"
          git config user.email "actions@github.com"
          touch posted_history.txt account_cursor.txt replied_comments.txt
          git add posted_history.txt reel_links.txt account_cursor.txt replied_comments.txt
          git diff --staged --quiet || (git commit -m "chore: sync US/UK virality ledger [skip ci]" && git pull --rebase origin main && git push)
