name: ARC US/UK Content Farm Engine

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: arc-30min-fleet-wave
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-arc-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Fonts & Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --upgrade pip
          pip install requests yt-dlp edge-tts

      - name: Execute ARC 30-Min Fleet Wave
        env:
          META_TOKEN_1: ${{ secrets.META_TOKEN_1 }}
          META_TOKEN_2: ${{ secrets.META_TOKEN_2 }}
          ARC_JOIN_LINK: ${{ secrets.ARC_JOIN_LINK }}
        run: python arc_engine.py

      - name: Save Ledger & Cursor State (Zero Merge Conflicts)
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ARC Fleet Engine"
          touch arc_ig_history.txt arc_dead_shortcodes.txt account_cursor.txt replied_comments.txt reel_links.txt
          cp arc_ig_history.txt /tmp/arc_ig_history.bak
          cp arc_dead_shortcodes.txt /tmp/arc_dead_shortcodes.bak
          cp replied_comments.txt /tmp/replied_comments.bak
          cp account_cursor.txt /tmp/account_cursor.bak
          git fetch origin main
          git reset --hard origin/main
          touch arc_ig_history.txt arc_dead_shortcodes.txt account_cursor.txt replied_comments.txt reel_links.txt
          cat /tmp/arc_ig_history.bak >> arc_ig_history.txt
          sort -u arc_ig_history.txt -o arc_ig_history.txt
          cat /tmp/arc_dead_shortcodes.bak >> arc_dead_shortcodes.txt
          sort -u arc_dead_shortcodes.txt -o arc_dead_shortcodes.txt
          cat /tmp/replied_comments.bak >> replied_comments.txt
          sort -u replied_comments.txt -o replied_comments.txt
          cp /tmp/account_cursor.bak account_cursor.txt
          git add arc_ig_history.txt arc_dead_shortcodes.txt account_cursor.txt replied_comments.txt reel_links.txt
          git diff --staged --quiet || (git commit -m "chore: update ARC wave ledger and state" && git push origin main)
