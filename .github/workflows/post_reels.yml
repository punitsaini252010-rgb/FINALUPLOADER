name: ARC US/UK Content Farm Engine

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: arc-30min-fleet-wave
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-arc-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --upgrade pip
          pip install requests yt-dlp

      - name: Execute ARC 30-Min Fleet Wave
        env:
          META_TOKEN_1: ${{ secrets.META_TOKEN_1 }}
          META_TOKEN_2: ${{ secrets.META_TOKEN_2 }}
          ARC_JOIN_LINK: ${{ secrets.ARC_JOIN_LINK }}
        run: python arc_engine.py

      - name: Save Ledger & Cursor State
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ARC Fleet Engine"
          touch posted_history.txt account_cursor.txt replied_comments.txt reel_links.txt
          git add posted_history.txt account_cursor.txt replied_comments.txt reel_links.txt
          git diff --staged --quiet || (git commit -m "chore: update ARC wave ledger" && git pull --rebase origin main && git push origin main)
