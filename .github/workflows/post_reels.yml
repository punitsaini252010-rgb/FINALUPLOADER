name: ARC 11x US-UK Tier-1 Network Engine

on:
  schedule:
    # 3 Hourly Waves (10:00, 12:00, 17:00 UTC)
    - cron: '0 10,12,17 * * *'
    # 8 Half-Hour Waves (01:30, 03:30, 05:30, 07:30, 14:30, 19:30, 21:30, 23:30 UTC)
    - cron: '30 1,3,5,7,14,19,21,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arc-reel-publisher
  cancel-in-progress: true

jobs:
  deploy-arc-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Bold Fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run ARC Publishing Engine (Live Unbuffered Logs)
        env:
          META_TOKEN_1: ${{ secrets.META_TOKEN_1 }}
          META_TOKEN_2: ${{ secrets.META_TOKEN_2 }}
          PYTHONUNBUFFERED: "1"
        run: python -u arc_engine.py

      - name: Lock Posted Reel History Back to Repo (Never Repeat)
        if: always()
        run: |
          git config user.name "ARC Auto-Ledger"
          git config user.email "actions@github.com"
          touch posted_history.txt
          git add posted_history.txt reel_links.txt
          git diff --staged --quiet || (git commit -m "chore: lock posted reel in history [skip ci]" && git pull --rebase origin main && git push)
