name: ARC 6-Hour Precision Sprint

on:
  workflow_dispatch:

concurrency:
  group: arc-unstoppable-sprint
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  unstoppable-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Fonts & Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --upgrade pip
          pip install requests yt-dlp edge-tts

      - name: The 30-Minute Precision Engine
        env:
          META_TOKEN_1: ${{ secrets.META_TOKEN_1 }}
          META_TOKEN_2: ${{ secrets.META_TOKEN_2 }}
          ARC_JOIN_LINK: ${{ secrets.ARC_JOIN_LINK }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ARC Fleet Engine"
          
          # 11 waves * 30 mins = 330 mins (fits safely inside GitHub's 360-min max limit)
          for i in {1..11}; do
            echo "🔥 === STARTING PRECISION WAVE $i/11 ==="
            START_TIME=$(date +%s)
            
            # 1. Run the Python Publisher
            python arc_engine.py || true
            
            # 2. Securely Save Ledger
            echo "💾 === SAVING LEDGER FOR WAVE $i ==="
            touch arc_ig_history.txt arc_dead_shortcodes.txt account_cursor.txt reel_links.txt
            cp arc_ig_history.txt /tmp/arc_ig_history.bak
            cp arc_dead_shortcodes.txt /tmp/arc_dead_shortcodes.bak
            cp account_cursor.txt /tmp/account_cursor.bak
            
            git fetch origin main
            git reset --hard origin/main
            
            touch arc_ig_history.txt arc_dead_shortcodes.txt account_cursor.txt reel_links.txt
            cat /tmp/arc_ig_history.bak >> arc_ig_history.txt
            sort -u arc_ig_history.txt -o arc_ig_history.txt
            cat /tmp/arc_dead_shortcodes.bak >> arc_dead_shortcodes.txt
            sort -u arc_dead_shortcodes.txt -o arc_dead_shortcodes.txt
            cp /tmp/account_cursor.bak account_cursor.txt
            
            git add arc_ig_history.txt arc_dead_shortcodes.txt account_cursor.txt reel_links.txt
            git diff --staged --quiet || (git commit -m "chore: wave $i save" && git push origin main)
            
            # 3. Calculate exact sleep needed to hit exactly 30 minutes
            END_TIME=$(date +%s)
            ELAPSED=$((END_TIME - START_TIME))
            SLEEP_TIME=$((1800 - ELAPSED)) # 1800 seconds = 30 minutes
            
            if [ $i -lt 11 ]; then
              if [ $SLEEP_TIME -gt 0 ]; then
                echo "⏱️ Script took $ELAPSED seconds. Sleeping for $SLEEP_TIME seconds to hit exactly 30 minutes."
                sleep $SLEEP_TIME
              else
                echo "⚠️ Script took $ELAPSED seconds (longer than 30 mins). Moving immediately to next wave."
                sleep 10
              fi
            fi
          done
          
