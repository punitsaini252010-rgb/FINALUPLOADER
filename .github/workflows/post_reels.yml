name: ARC 10x Daily Network Engine

on:
  schedule:
    # Fires 10 times a day in UTC, weighted for US & UK peak hours
    - cron: '0 12,14,16,18,19,21,23,1,3,7 * * *'
  workflow_dispatch:

concurrency:
  group: arc-reel-publisher
  cancel-in-progress: false

jobs:
  deploy-arc-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run ARC Publishing Engine
        env:
          META_TOKEN_1: ${{ secrets.META_TOKEN_1 }}
          META_TOKEN_2: ${{ secrets.META_TOKEN_2 }}
        run: python arc_engine.py
        
