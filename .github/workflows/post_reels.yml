name: ARC Unified Autonomous Engine

on:
  schedule:
    - cron: '0 0,3,9,13,18 * * *'
  workflow_dispatch:

concurrency:
  group: arc-engine-fleet-wave
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-autonomous-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          pip install --upgrade pip
          pip install requests edge-tts "yt-dlp[default]"

      - name: Verify Workspace & Assets
        run: |
          ls -la
          ls -la reels assets 2>/dev/null || true
          ffmpeg -version | head -n 1
          edge-tts --version

      - name: Run ARC Engine
        env:
          META_TOKEN_1: ${{ secrets.META_TOKEN_1 }}
          META_TOKEN_2: ${{ secrets.META_TOKEN_2 }}
          META_TOKEN_3: ${{ secrets.META_TOKEN_3 }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKENS: ${{ secrets.YT_REFRESH_TOKENS }}
          IG_COOKIES_TXT: ${{ secrets.IG_COOKIES_TXT }}
          IG_SOURCE_ACCOUNTS: ${{ secrets.IG_SOURCE_ACCOUNTS }}
        run: python arc_engine.py

      - name: Save Harvester Pool & Posted History
        run: |
          git config --local user.name "arc-bot"
          git config --local user.email "action@github.com"
          git add posted_history.json arc_ig_history.txt arc_dead_shortcodes.txt arc_discovered_pool.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update ARC harvester pool and posted history [skip ci]"
            git pull --rebase --autostash origin HEAD || true
            git push
          else
            echo "No state file updates to commit."
          fi
          
